name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI — Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Selecionar validações
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          source infra/deploy-plan.sh
          plan_changes "$BASE_SHA" HEAD
          echo "runtime=$((frontend + backend + deps))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: steps.plan.outputs.runtime != '0'
        with:
          node-version: 20
          cache: npm
      - name: Instalar no runner limpo
        if: steps.plan.outputs.runtime != '0'
        run: npm ci --include=dev --no-audit --no-fund
      - name: Testar automação de deploy
        run: python3 -B -m unittest discover -s infra/tests -p 'test_*.py'
      - name: Validar escopo
        env:
          BASE_SHA: ${{ github.event.before }}
        run: bash infra/deploy-validate.sh "$BASE_SHA"

  deploy:
    name: Deploy → Produção
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/eixo
            git fetch --quiet origin main
            executor=$(mktemp)
            trap 'rm -f "$executor"' EXIT
            git show "${{ github.sha }}:infra/deploy.sh" > "$executor"
            bash "$executor" "${{ github.sha }}"
